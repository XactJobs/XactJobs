name: Feature request
description: Something XactJobs could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and why it's hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work, from your code's point of view.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Workarounds, or how other libraries do it.
