# Builds the solution and runs the tests on pull requests and on pushes to main.
# The database suites run in containers (Testcontainers, with the runner's Docker), one job per database and
# framework, so each runner pulls only the image it needs and starts one container at a time.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a new push to a pull request cancels its runs still in progress (not on main, where each push is checked)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # the whole solution in Release: the library on net8.0 too, the benchmarks and the test web app
  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - run: dotnet build -c Release src/XactJobs.sln

  test:
    name: ${{ matrix.name }} (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0]
        name: [Core, Postgres16, Postgres17, Postgres18, OfficialMySql, PomeloMySql, SqlServer, Oracle]
        exclude:
          # Pomelo doesn't support EF Core 10 yet
          - name: PomeloMySql
            framework: net10.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build
        run: |
          dotnet build -f ${{ matrix.framework }} src/XactJobs.Tests/XactJobs.Tests.csproj
          if [ "${{ matrix.name }}" = Core ]; then
            dotnet build -f ${{ matrix.framework }} src/XactJobs.UI.Tests/XactJobs.UI.Tests.csproj
          fi

      - name: Test
        run: |
          # fails if a suite ran no tests or skipped any: the database tests skip themselves without Docker,
          # and a filter that matches nothing passes
          run_tests() {
            dotnet test --no-build -f ${{ matrix.framework }} "$@" | tee test-output.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            if ! grep -qE 'Passed!.*Skipped: +0, Total: +[1-9]' test-output.txt; then
              echo "::error::No tests ran, or some were skipped"
              exit 1
            fi
          }

          if [ "${{ matrix.name }}" = Core ]; then
            run_tests src/XactJobs.Tests/XactJobs.Tests.csproj \
              --filter "FullyQualifiedName!~XactJobs.Tests.Databases&FullyQualifiedName!~XactJobs.Tests.Postgres"
            run_tests src/XactJobs.UI.Tests/XactJobs.UI.Tests.csproj
          else
            # Databases/ (its *IntegrationTests and *DashboardTests), and for PostgreSQL also Postgres/
            filter="FullyQualifiedName~XactJobs.Tests.Databases.${{ matrix.name }}"
            case "${{ matrix.name }}" in
              Postgres*) filter="$filter|FullyQualifiedName~XactJobs.Tests.Postgres.${{ matrix.name }}" ;;
            esac
            run_tests src/XactJobs.Tests/XactJobs.Tests.csproj --filter "$filter"
          fi
