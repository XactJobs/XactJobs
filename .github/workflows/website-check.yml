# Builds the website (website/) on pull requests that change it. Website.yml deploys it from main.
name: Website check

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/images/**'
      - '.github/workflows/website-check.yml'

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build
