# Updates of the dependencies, once a month, each ecosystem in one grouped pull request. Security updates come
# separately, as soon as there's an advisory (Dependabot alerts in the repository's settings).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # major versions by hand: EF Core 9 stays on net8.0 and net9.0 (EF Core 10 only targets net10.0), Pomelo
      # stays on EF Core 9, and a new .NET version is a change of the target frameworks
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
